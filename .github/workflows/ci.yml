name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Run Vitest suites
        run: npx vitest run

      - name: Run self-contained JavaScript suites
        shell: bash
        run: |
          for test_file in tests/*.test.js; do
            if grep -q "from 'vitest'" "$test_file"; then
              continue
            fi
            node "$test_file"
          done

      - name: Build web application
        run: npm run build

      - name: Build standalone bundle
        run: npm run build:standalone

      - name: Verify standalone bundle ships no LLM/bridge networking code
        shell: bash
        run: |
          set -uo pipefail
          patterns=(
            'api\.anthropic\.com'
            'api\.openai\.com'
            'generativelanguage\.googleapis\.com'
            'anthropic-dangerous-direct-browser-access'
            'x-api-key'
            'Is Ollama running at'
            'LM Studio error'
            'Bridge access token is required'
          )
          leaked=0
          for pattern in "${patterns[@]}"; do
            if grep -Rl -E "$pattern" dist-standalone/assets/*.js; then
              echo "::error::Found forbidden string matching '$pattern' in the standalone bundle"
              leaked=1
            fi
          done
          exit "$leaked"

  pyez-bridge:
    name: PyEZ bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/pyez-bridge/requirements.txt

      - name: Install bridge dependencies
        run: python -m pip install -r tools/pyez-bridge/requirements.txt

      - name: Run bridge tests
        run: python -m unittest discover tools/pyez-bridge/tests -v
